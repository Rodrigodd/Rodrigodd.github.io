<footer class="site-footer h-card">
  <data class="u-url" href="/"></data>

  <div class="wrapper">
    {%- if site.description %}
    <p class="footer-description">{{ site.description }}</p>
    {%- endif %}

    <div class="social-links"><ul class="social-media-list">
      <li>
  <a href="/feed.xml" title="RSS feed">
    <svg class="svg-icon orange">
      <use xlink:href="/assets/minima-social-icons.svg#rss"></use>
    </svg>
  </a>
</li>
      {%- for entry in site.social_links %}<li>
  <a rel="me" href="{{ entry.user_url }}" target="_blank" title="{{ entry.platform }}">
    <svg class="svg-icon grey">
      <use xlink:href="/assets/minima-social-icons.svg#{{ entry.platform }}"></use>
    </svg>
  </a>
</li>
{% endfor -%}
</ul>
</div>

  </div>

</footer>
