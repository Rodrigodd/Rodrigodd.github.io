<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ seo.title }}</title>
<meta property="og:title" content="{{ seo.og_title }}" />
<meta property="og:locale" content="en_US" />
{%- if seo.description %}
<meta name="description" content="{{ seo.description }}" />
<meta property="og:description" content="{{ seo.description }}" />
{%- endif %}
<link rel="canonical" href="{{ seo.url }}" />
<meta property="og:url" content="{{ seo.url }}" />
<meta property="og:site_name" content="{{ site.title }}" />
<meta property="og:type" content="{{ seo.og_type }}" />
{%- if seo.published_time %}
<meta property="article:published_time" content="{{ seo.published_time }}" />
{%- endif %}
<meta name="twitter:card" content="summary" />
<meta property="twitter:title" content="{{ seo.og_title }}" />
<script type="application/ld+json">
{{ seo.json_ld|safe }}</script>
<link rel="stylesheet" href="/assets/css/style.css"><link type="application/atom+xml" rel="alternate" href="{{ site.url }}/feed.xml" title="{{ site.title }}" />
</head>
